# GitHub repository search (unauthenticated: ~10 requests/minute). Specialist engine: `!gh` or `!it`.
name = "github"
shortcut = "gh"
categories = ["it"]
kind = "json"
ua = "api"
url = "https://api.github.com/search/repositories?q={q}&per_page=10"
results = "items"

[fields]
url = "{html_url}"
title = "{full_name}"
content = "★ {stargazers_count} · {description}"
